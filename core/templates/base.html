{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-text">Todo</span>
        </div>
        <nav class="nav-actions">
          {% if user.is_authenticated %}
            <span class="nav-user">Hi, {{ user.username }}</span>
            <a class="btn btn-ghost" href="{% url 'task_list' %}">Tasks</a>
            <form class="inline-form" method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-ghost">Logout</button>
            </form>
          {% else %}
            <a class="btn btn-ghost" href="{% url 'login' %}">Login</a>
            <a class="btn btn-primary" href="{% url 'register' %}">Register</a>
          {% endif %}
        </nav>
      </header>

      <main class="app-main">
        <section class="card">
          {% block content %}{% endblock %}
        </section>
      </main>

      <footer class="app-footer">
      </footer>
    </div>
  </body>
</html>
